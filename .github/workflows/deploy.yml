name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - favicon
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      
      - name: Install dependencies
        run: npm install
      
      - name: Build
        run: npm run build
        env:
          CI: false
          # AdSense. Until ADSENSE_CLIENT is set as a repository secret, no ad
          # markup and no loader script are emitted anywhere on the site.
          # Settings > Secrets and variables > Actions > New repository secret.
          ADSENSE_CLIENT: ${{ secrets.ADSENSE_CLIENT }}
          AD_SLOT_ARTICLE_TOP: ${{ secrets.AD_SLOT_ARTICLE_TOP }}
          AD_SLOT_IN_CONTENT: ${{ secrets.AD_SLOT_IN_CONTENT }}
          AD_SLOT_SIDEBAR: ${{ secrets.AD_SLOT_SIDEBAR }}
          AD_SLOT_FOOTER: ${{ secrets.AD_SLOT_FOOTER }}
          AD_SLOT_TOOL_TOP: ${{ secrets.AD_SLOT_TOOL_TOP }}
          AD_SLOT_TOOL_RESULT: ${{ secrets.AD_SLOT_TOOL_RESULT }}
          AD_SLOT_HUB: ${{ secrets.AD_SLOT_HUB }}
      
      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build
          cname: junepoint.com
