name: Editorial pipeline

# Drafts articles from the commission queue and opens a pull request.
#
# It deliberately does NOT push to main. Every gate here is mechanical: it can
# check punctuation, duplication, schema and internal links, but it cannot
# verify that a claim is true or that a phrase is original. A human read is the
# only thing between a plausible wrong number and the published site.
#
# Authentication uses a Claude Code token from `claude setup-token`, so no
# Anthropic API key is needed. draft.js selects the CLI transport automatically
# whenever ANTHROPIC_API_KEY is absent.

on:
  schedule:
    - cron: '0 9 * * 1-5'   # 09:00 UTC, weekdays. Deliberately not daily.
  workflow_dispatch:
    inputs:
      count:
        description: How many articles to draft
        default: '2'

permissions:
  contents: write
  pull-requests: write

jobs:
  draft:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - run: npm ci || npm install

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - name: Draft from commission queue
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          CONTENT_MODEL: ${{ vars.CONTENT_MODEL || 'claude-opus-5' }}
        run: node content/editorial/draft.js --count ${{ github.event.inputs.count || '2' }}

      # Gate the drafts this run produced, not the whole corpus. Failing on a
      # pre-existing page would block every future run over something the bot
      # did not write and cannot fix.
      - name: Enforce house style on new drafts
        run: node content/editorial/house-style-lint.js --changed

      # Whole-corpus scan is advisory: it surfaces drift without blocking.
      - name: Report house style across all content
        continue-on-error: true
        run: node content/editorial/house-style-lint.js

      - name: Build and validate
        run: |
          npm run build:content
          npm run check:content

      - name: Open pull request
        uses: peter-evans/create-pull-request@v8
        with:
          branch: drafts/${{ github.run_number }}
          delete-branch: true
          commit-message: 'content: drafts from the commission queue'
          title: 'Editorial: drafts for review (${{ github.run_number }})'
          body: |
            Drafted from the commission queue. Passed automatically:

            - house style lint (punctuation, filler phrases, sentence cadence)
            - duplicate detection against every published page
            - schema validation and the full content build
            - link, canonical, structured data and alt text checks

            **Still needs a human before merge:**

            - [ ] Every factual claim, figure and price spot checked
            - [ ] Nothing reads as copied from a source
            - [ ] Commands and code samples actually run
            - [ ] It is genuinely worth publishing
